# Armbian application launcher style.
[main]
font=JetBrains Mono:size=12
icon-theme=Papirus-Dark
terminal=foot
prompt="> "
width=40
lines=12
horizontal-pad=20
vertical-pad=14
inner-pad=8

[colors]
background=161616f2
text=e6e6e6ff
prompt=f71000ff
input=ffffffff
match=f71000ff
selection=f71000ff
selection-text=ffffffff
selection-match=ffffffff
border=f71000ff

[border]
width=2
radius=0

# Armbian defaults for hyprlock. armbian-config copies this file to
# ~/.config/hypr/ once; edit your copy there.

general {
	hide_cursor = true
}

background {
	monitor =
	path = /usr/share/backgrounds/armbian/armbian03-Dre0x-Minum-dark-3840x2160.jpg
	blur_passes = 2
}

label {
	monitor =
	text = $TIME
	font_size = 64
	color = rgb(eeeeee)
	position = 0, 80
	halign = center
	valign = center
}

input-field {
	monitor =
	size = 300, 50
	outline_thickness = 2
	# Armbian orange
	outer_color = rgb(f71000)
	inner_color = rgb(202020)
	font_color = rgb(eeeeee)
	placeholder_text = Password
	position = 0, -40
	halign = center
	valign = center
}

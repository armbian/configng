# Armbian defaults for Hyprland. armbian-config replaces this file.
# Put your own settings in ~/.config/hypr/hyprland.conf: it is read
# after this file, so your values win.

$terminal = foot
$fileManager = thunar
$browser = uwsm app -- x-www-browser
$menu = fuzzel --launch-prefix="uwsm app -- "
$tools = /usr/lib/armbian/hyprland
$wallpaper = /usr/share/backgrounds/armbian/armbian03-Dre0x-Minum-dark-3840x2160.jpg

monitor = , preferred, auto, auto

# uwsm starts waybar, mako, hypridle and hyprpolkitagent as systemd
# user services, and nm-applet and blueman by XDG autostart.
exec-once = uwsm app -- swaybg -m fill -i $wallpaper
exec-once = uwsm app -- swayosd-server
# Dark style and icons for GTK and portal apps.
exec-once = gsettings set org.gnome.desktop.interface color-scheme prefer-dark
exec-once = gsettings set org.gnome.desktop.interface gtk-theme Adwaita-dark
exec-once = gsettings set org.gnome.desktop.interface icon-theme Papirus-Dark
exec-once = gsettings set org.gnome.desktop.interface font-name "Noto Sans 11"
exec-once = gsettings set org.gnome.desktop.interface monospace-font-name "JetBrains Mono 11"

env = XCURSOR_SIZE,24

general {
	gaps_in = 5
	gaps_out = 10
	border_size = 2
	# Armbian orange
	col.active_border = rgb(f71000)
	col.inactive_border = rgba(33333399)
	resize_on_border = true
	layout = dwindle
}

decoration {
	rounding = 0
	# Blur costs too much on many SBC GPUs.
	blur {
		enabled = false
	}
	shadow {
		enabled = false
	}
}

animations {
	enabled = true
	bezier = snappy, 0.05, 0.9, 0.1, 1.0
	animation = windows, 1, 3, snappy, popin 80%
	animation = border, 1, 5, default
	animation = fade, 1, 3, default
	animation = workspaces, 1, 3, snappy, slide
}

dwindle {
	preserve_split = true
}

misc {
	force_default_wallpaper = 0
	disable_hyprland_logo = true
	disable_splash_rendering = true
}

# No update and donation dialogs: Armbian updates Hyprland with the system.
ecosystem {
	no_update_news = true
	no_donation_nag = true
}

input {
	follow_mouse = 1
	touchpad {
		tap-to-click = true
	}
}

gesture = 3, horizontal, workspace

$mod = SUPER

bind = $mod, Return, exec, uwsm app -- $terminal
bind = $mod, Space, exec, $menu
bind = $mod, D, exec, $menu
bind = $mod, B, exec, $browser
bind = $mod, F, exec, uwsm app -- $fileManager
bind = $mod, W, killactive,
bind = $mod, Q, killactive,
bind = $mod, Escape, exec, $tools/power-menu
bind = $mod, K, exec, $tools/key-help
bind = $mod, L, exec, loginctl lock-session
bind = $mod SHIFT, E, exec, uwsm stop
bind = $mod, V, togglefloating,
bind = $mod SHIFT, F, fullscreen,
bind = $mod, P, pseudo,

bind = $mod, left, movefocus, l
bind = $mod, right, movefocus, r
bind = $mod, up, movefocus, u
bind = $mod, down, movefocus, d
bind = $mod SHIFT, left, swapwindow, l
bind = $mod SHIFT, right, swapwindow, r
bind = $mod SHIFT, up, swapwindow, u
bind = $mod SHIFT, down, swapwindow, d

bind = $mod, 1, workspace, 1
bind = $mod, 2, workspace, 2
bind = $mod, 3, workspace, 3
bind = $mod, 4, workspace, 4
bind = $mod, 5, workspace, 5
bind = $mod, 6, workspace, 6
bind = $mod, 7, workspace, 7
bind = $mod, 8, workspace, 8
bind = $mod, 9, workspace, 9
bind = $mod SHIFT, 1, movetoworkspace, 1
bind = $mod SHIFT, 2, movetoworkspace, 2
bind = $mod SHIFT, 3, movetoworkspace, 3
bind = $mod SHIFT, 4, movetoworkspace, 4
bind = $mod SHIFT, 5, movetoworkspace, 5
bind = $mod SHIFT, 6, movetoworkspace, 6
bind = $mod SHIFT, 7, movetoworkspace, 7
bind = $mod SHIFT, 8, movetoworkspace, 8
bind = $mod SHIFT, 9, movetoworkspace, 9
bind = $mod, Tab, workspace, e+1
bind = $mod SHIFT, Tab, workspace, e-1
bind = $mod, mouse_down, workspace, e+1
bind = $mod, mouse_up, workspace, e-1

bindm = $mod, mouse:272, movewindow
bindm = $mod, mouse:273, resizewindow

# Volume and brightness with an on-screen display. swayosd is not in
# every release: then fall back to the plain tools.
bindel = , XF86AudioRaiseVolume, exec, swayosd-client --output-volume raise || wpctl set-volume -l 1 @DEFAULT_AUDIO_SINK@ 5%+
bindel = , XF86AudioLowerVolume, exec, swayosd-client --output-volume lower || wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
bindl = , XF86AudioMute, exec, swayosd-client --output-volume mute-toggle || wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
bindel = , XF86MonBrightnessUp, exec, swayosd-client --brightness raise || brightnessctl set 5%+
bindel = , XF86MonBrightnessDown, exec, swayosd-client --brightness lower || brightnessctl set 5%-
bindl = , XF86AudioPlay, exec, playerctl play-pause
bindl = , XF86AudioNext, exec, playerctl next
bindl = , XF86AudioPrev, exec, playerctl previous

# Screenshot to the clipboard: area, or the whole screen with Shift.
bind = , Print, exec, grim -g "$(slurp)" - | wl-copy
bind = SHIFT, Print, exec, grim - | wl-copy

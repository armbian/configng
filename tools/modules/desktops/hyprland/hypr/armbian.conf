# Armbian defaults for Hyprland. armbian-config replaces this file.
# Put your own settings in ~/.config/hypr/hyprland.conf: it is read
# after this file, so your values win.

$terminal = foot
$fileManager = thunar
$menu = fuzzel --launch-prefix="uwsm app -- "
$wallpaper = /usr/share/backgrounds/armbian/armbian03-Dre0x-Minum-dark-3840x2160.jpg

monitor = , preferred, auto, auto

# uwsm starts waybar, mako, hypridle and hyprpolkitagent as systemd
# user services, and nm-applet and blueman by XDG autostart.
exec-once = uwsm app -- swaybg -m fill -i $wallpaper

general {
	gaps_in = 4
	gaps_out = 8
	border_size = 2
	# Armbian orange
	col.active_border = rgba(f71000ee) rgba(ff8a00ee) 45deg
	col.inactive_border = rgba(595959aa)
	resize_on_border = true
	layout = dwindle
}

decoration {
	rounding = 8
	# Blur costs too much on many SBC GPUs.
	blur {
		enabled = false
	}
}

animations {
	enabled = true
}

dwindle {
	pseudotile = true
	preserve_split = true
}

misc {
	force_default_wallpaper = 0
	disable_hyprland_logo = true
	disable_splash_rendering = true
}

# No update and donation dialogs: Armbian updates Hyprland with the system.
ecosystem {
	no_update_news = true
	no_donation_nag = true
}

input {
	follow_mouse = 1
	touchpad {
		tap-to-click = true
	}
}

gesture = 3, horizontal, workspace

$mod = SUPER

bind = $mod, Return, exec, uwsm app -- $terminal
bind = $mod, D, exec, $menu
bind = $mod, Space, exec, $menu
bind = $mod, E, exec, uwsm app -- $fileManager
bind = $mod, Q, killactive,
bind = $mod, L, exec, loginctl lock-session
bind = $mod SHIFT, E, exec, uwsm stop
bind = $mod, V, togglefloating,
bind = $mod, F, fullscreen,
bind = $mod, P, pseudo,

bind = $mod, left, movefocus, l
bind = $mod, right, movefocus, r
bind = $mod, up, movefocus, u
bind = $mod, down, movefocus, d

bind = $mod, 1, workspace, 1
bind = $mod, 2, workspace, 2
bind = $mod, 3, workspace, 3
bind = $mod, 4, workspace, 4
bind = $mod, 5, workspace, 5
bind = $mod, 6, workspace, 6
bind = $mod, 7, workspace, 7
bind = $mod, 8, workspace, 8
bind = $mod, 9, workspace, 9
bind = $mod SHIFT, 1, movetoworkspace, 1
bind = $mod SHIFT, 2, movetoworkspace, 2
bind = $mod SHIFT, 3, movetoworkspace, 3
bind = $mod SHIFT, 4, movetoworkspace, 4
bind = $mod SHIFT, 5, movetoworkspace, 5
bind = $mod SHIFT, 6, movetoworkspace, 6
bind = $mod SHIFT, 7, movetoworkspace, 7
bind = $mod SHIFT, 8, movetoworkspace, 8
bind = $mod SHIFT, 9, movetoworkspace, 9
bind = $mod, mouse_down, workspace, e+1
bind = $mod, mouse_up, workspace, e-1

bindm = $mod, mouse:272, movewindow
bindm = $mod, mouse:273, resizewindow

bindel = , XF86AudioRaiseVolume, exec, wpctl set-volume -l 1 @DEFAULT_AUDIO_SINK@ 5%+
bindel = , XF86AudioLowerVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
bindl = , XF86AudioMute, exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
bindel = , XF86MonBrightnessUp, exec, brightnessctl set 5%+
bindel = , XF86MonBrightnessDown, exec, brightnessctl set 5%-
bindl = , XF86AudioPlay, exec, playerctl play-pause
bindl = , XF86AudioNext, exec, playerctl next
bindl = , XF86AudioPrev, exec, playerctl previous

# Screenshot to the clipboard: area, or the whole screen with Shift.
bind = , Print, exec, grim -g "$(slurp)" - | wl-copy
bind = SHIFT, Print, exec, grim - | wl-copy

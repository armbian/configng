name: hyprland
description: "Hyprland - dynamic tiling Wayland compositor"
display_manager: sddm
# Wayland session for autologin: the Omarchy session from armbian-hyprland-shell.
session: omarchy
status: community

# The Omarchy port: armbian-hyprland-shell (armbian/external) brings the
# complete configuration. Its Recommends are the Omarchy package set.
tiers:
  minimal:
    packages:
      - hyprland
      - uwsm
      - xdg-desktop-portal-hyprland
      - xdg-desktop-portal-gtk
      - hyprlock
      - hypridle
      - hyprland-qtutils
      - foot
      - chromium
      - wl-clipboard
      - grim
      - slurp
      - brightnessctl
      - playerctl
      - qt6-wayland
      - qtwayland5
      - fonts-font-awesome
      - fonts-noto-core
      - fonts-jetbrains-mono
      - gnome-themes-extra
      - papirus-icon-theme
      - libglib2.0-bin
      - sddm
      - xwayland
      - xdg-user-dirs
      - pipewire-audio
      - pipewire-pulse
      - wireplumber
      - accountsservice
      - armbian-hyprland-shell
      # SD-card image flasher. Other desktops get it from the mid tier.
      - armbian-imager
    packages_remove:
      - terminator

# Only Debian forky: armbian-hyprland-shell is built for forky.
releases:
  forky:
    architectures: [arm64, amd64]
    # apt installs Recommends here (Armbian turns them off). nautilus
    # recommends xdg-desktop-portal-gnome, which pulls in GNOME Shell and
    # gdm3: keep it out.
    install_recommends: true
    packages_exclude:
      - xdg-desktop-portal-gnome

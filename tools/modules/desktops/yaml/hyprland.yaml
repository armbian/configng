name: hyprland
description: "Hyprland - dynamic tiling Wayland compositor"
display_manager: sddm
# Wayland session for autologin: the Omarchy session from armbian-hyprland-shell.
session: omarchy
status: community

# The Omarchy port: armbian-hyprland-shell (armbian/external) brings the
# complete configuration. The full tier lists the Omarchy package set.
tiers:
  minimal:
    packages:
      - hyprland
      - uwsm
      - xdg-desktop-portal-hyprland
      - xdg-desktop-portal-gtk
      - hyprland-qtutils
      - foot
      - wl-clipboard
      - grim
      - slurp
      - brightnessctl
      - playerctl
      - qt6-wayland
      - qtwayland5
      - fonts-font-awesome
      - fonts-noto-core
      - fonts-jetbrains-mono
      - gnome-themes-extra
      - papirus-icon-theme
      - libglib2.0-bin
      - sddm
      - xwayland
      - xdg-user-dirs
      - pipewire-audio
      - pipewire-pulse
      - wireplumber
      - accountsservice
      - armbian-hyprland-shell
      # The shell calls these: app and terminal launch, menus,
      # notifications, Bluetooth, power, volume, night light, color picker.
      - libgtk-3-bin
      - xdg-terminal-exec
      - gum
      - libnotify-bin
      - wtype
      - bluez
      - power-profiles-daemon
      - pamixer
      - hyprsunset
      - hyprpicker
      # Default file manager, image and video viewer, keyring, automount.
      - nautilus
      - gvfs-backends
      - imv
      - mpv
      - gnome-keyring
      # Unlocks the keyring at SDDM login (pam.d/sddm calls it).
      - libpam-gnome-keyring
      - udiskie
      # man pages use bat as pager. fzf: menu and shell search.
      - bat
      - fzf
      # Screensaver text effects.
      - ttfx
      # .local names and network printers.
      - avahi-daemon
      - libnss-mdns
      # Emoji in the picker and on web pages.
      - fonts-noto-color-emoji
      # First-boot setup enables the firewall when both are present.
      - ufw
      - ufw-docker
      # Snapshots before updates. omarchy-snapshot skips quietly without btrfs.
      - snapper
    packages_remove:
      - terminator
  mid:
    # Chromium on every architecture, as upstream Omarchy.
    packages:
      - chromium
      # SD-card image flasher.
      - armbian-imager
      # Terminal tools the Omarchy shell config uses when present.
      - btop
      - fastfetch
      - starship
      - zoxide
      - eza
      - fd-find
      - ripgrep
      - plocate
    # Not in Omarchy: it has imv, mpv and its own tools.
    packages_remove:
      - browser
      - gnome-text-editor
      - gnome-calculator
      - loupe
      - vlc
      - file-roller
      - transmission-gtk
      - mesa-utils
      - vulkan-tools
      - glmark2-wayland
      - glmark2-es2-wayland
      - glmark2-x11
      - glmark2-es2-x11
  full:
    # The Omarchy base set (upstream install/omarchy-base.packages, Debian
    # names from the armbian-hyprland-shell deps.map) and the tools that the
    # shell scripts call. No Recommends: they add 5 GB. Optional Omarchy
    # apps install from the Omarchy menu.
    # Not in Omarchy. Code installs from the Omarchy menu.
    packages_remove:
      - gimp
      - inkscape
      - thunderbird
      - audacity
      - code
    packages:
      - aether
      - alsa-topology-conf
      - alsa-ucm-conf
      - alsa-utils
      - at-spi2-core
      - avahi-daemon
      - bash-completion
      - bat

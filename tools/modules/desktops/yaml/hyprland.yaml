tier_overrides:
  full:
    architectures:
      amd64:
        # Obsidian is mirrored for amd64 only. Intel video and power.
        packages:
          - obsidian
          - intel-media-va-driver
          - i965-va-driver
          - libmfx-gen1.2
          - thermald
          - intel-lpmd

# Only Debian forky: armbian-hyprland-shell is built for forky.
releases:
  forky:
    architectures: [arm64, amd64]
    # nautilus recommends xdg-desktop-portal-gnome, which pulls in GNOME
    # Shell and gdm3: keep it out.
    packages_exclude:
      - xdg-desktop-portal-gnome

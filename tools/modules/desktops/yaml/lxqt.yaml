name: lxqt
description: "LXQt - lightweight Qt desktop"
display_manager: sddm
status: supported

# LXQt is a lightweight Qt desktop. `lxqt-core` pulls the session
# (lxqt-session, lxqt-panel, lxqt-config, pcmanfm-qt, openbox, ...); the
# rest of minimal adds the Qt-native base apps plus the same X / theme /
# audio base every desktop shares. Mid and full are inherited additively
# from common.yaml - only LXQt-specific extras and GTK->Qt swaps live
# here (see kde-plasma.yaml for the same pattern).
tiers:
  minimal:
    packages:
      - lxqt-core
      - lxqt-about
      - lxqt-admin
      - lxqt-powermanagement
      - lxqt-sudo
      - pcmanfm-qt
      - qterminal
      - featherpad
      - qps
      - qlipper
      - screengrab
      - pavucontrol-qt
      - nm-tray
      - openbox
      - sddm
      - xserver-xorg
      - dbus-x11
      - dmz-cursor-theme
      - fonts-ubuntu
      - gtk2-engines
      - gtk2-engines-murrine
      - gtk2-engines-pixbuf
      - gvfs-backends
      - lm-sensors
      - pulseaudio
      - pulseaudio-module-bluetooth
      - spice-vdagent
      - xdg-user-dirs

  mid:
    # LXQt ships featherpad (editor) and adds lxqt-archiver here, so drop
    # the GTK equivalents inherited from common.yaml's mid tier.
    packages_remove:
      - gnome-text-editor
      - file-roller
    packages:
      - lxqt-archiver
      - qpdfview

  full:
    # Qt-native creative app alongside the GIMP/Inkscape from common.
    packages:
      - krita

releases:
  bookworm:
    architectures: [arm64, amd64]
    packages:
      - accountsservice
      - libu2f-udev

  trixie:
    architectures: [arm64, amd64]
    packages:
      - accountsservice
      - libu2f-udev
      - pipewire-audio
      - pipewire-pulse
      - wireplumber
    packages_remove:
      - pulseaudio
      - pulseaudio-module-bluetooth

  noble:
    architectures: [arm64, amd64]
    packages:
      - polkitd
      - pkexec
      - libu2f-udev

  forky:
    # Debian 14 - pipewire replaces pulseaudio (same as trixie).
    architectures: [arm64, amd64]
    packages:
      - accountsservice
      - pipewire-audio
      - pipewire-pulse
      - wireplumber
    packages_remove:
      - pulseaudio
      - pulseaudio-module-bluetooth

  sid:
    # Debian unstable - pipewire replaces pulseaudio (same as trixie/forky).
    architectures: [arm64, amd64, loong64]
    packages:
      - accountsservice
      - libu2f-udev
      - pipewire-audio
      - pipewire-pulse
      - wireplumber
    packages_remove:
      - pulseaudio
      - pulseaudio-module-bluetooth

  jammy:
    # Ubuntu 22.04 LTS - pulseaudio remains default.
    architectures: [arm64, amd64]
    packages:
      - polkitd
      - pkexec
      - libu2f-udev

  # resolute (Ubuntu 26.04 LTS) is intentionally omitted so it is reported
  # unavailable for LXQt and never enters the build matrix. Its lxqt-panel
  # (2.3.2-0ubuntu1) and lxqt-branding-debian (0.14.0.7, pulled in as a
  # Recommends of lxqt-core) both ship /etc/xdg/lxqt/panel.conf with no
  # Replaces/Conflicts, so dpkg aborts the unpack and lxqt-core can't install
  # (upstream Ubuntu packaging bug, not ours). Re-add the block below once the
  # archive resolves the conffile conflict - see tests/LXQT01.conf.
  #resolute:
  #  # Ubuntu 26.04 LTS.
  #  architectures: [arm64, amd64]
  #  packages:
  #    - polkitd
  #    - pkexec
  #    - libfido2-1

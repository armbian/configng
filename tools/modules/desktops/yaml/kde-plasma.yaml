name: kde-plasma
description: "KDE Plasma - feature-rich customizable desktop"
display_manager: sddm
status: supported

# KDE Plasma minimal already ships its own konsole, dolphin, ark
# (archive manager), gwenview (image viewer), okular (PDF viewer).
# At the mid tier we override common.yaml's GTK choices to use the
# native KDE applications instead, and at full tier we swap
# libreoffice-gtk3 for libreoffice-kde so the office suite uses the
# Plasma integration backend.
tiers:
  minimal:
    packages:
      - kde-plasma-desktop
      - sddm
      - sddm-theme-breeze
      - konsole
      - dolphin
      - ark
      - bluedevil
      - gwenview
      - kscreen
      - okular
      - plasma-nm
      - plasma-pa
      # plasma-desktop only recommends these. The panel has launchers for both.
      # Discover brings PackageKit, its apt backend, and shows updates.
      - plasma-discover
      # Firmware updates in Discover.
      - fwupd
      - plasma-discover-backend-fwupd
      - systemsettings
      # More plasma-desktop / plasma-workspace recommends. Without
      # them: no power management, no portal, no Dolphin thumbnails,
      # no wallet unlock at login, empty system monitor widgets.
      - breeze-gtk-theme
      - ffmpegthumbs
      - kde-config-gtk-style
      - kde-config-screenlocker
      - kde-config-sddm
      - kde-spectacle
      # Spectacle text recognition (OCR).
      - tesseract-ocr
      - tesseract-ocr-eng
      - kdegraphics-thumbnailers
      - kinfocenter
      # Info Center pages run these tools. Without them, the pages are empty.
      - aha
      - clinfo
      - libdisplay-info-bin
      - pulseaudio-utils
      - wayland-utils
      - kio-extras
      - kmenuedit
      - ksshaskpass
      - ksystemstats
      - kwalletmanager
      - libpam-kwallet5
      - plasma-systemmonitor
      - powerdevil
      - xdg-desktop-portal-kde
      - xserver-xorg
      - dbus-x11
      - dmz-cursor-theme
      - fonts-ubuntu
      - gtk2-engines
      - gtk2-engines-murrine
      - gtk2-engines-pixbuf
      - gvfs-backends
      - lm-sensors
      - pulseaudio
      - pulseaudio-module-bluetooth
      - spice-vdagent
      - xdg-user-dirs

  mid:
    # Drop the GTK-stack equivalents that KDE already provides via
    # ark/gwenview/okular at the minimal tier.
    packages_remove:
      - gnome-text-editor
      - file-roller
      - loupe
      - gnome-calculator
    packages:
      - kate
      - kcalc
      - partitionmanager
      - plasma-browser-integration
      - gstreamer1.0-libav

  full:
    # KDE Plasma drops the libreoffice-gtk3 integration package
    # because we want native KDE file pickers / theming. There used
    # to be a 'libreoffice-kde' package but it was retired upstream
    # and no longer exists in any Debian / Ubuntu release we support
    # (verified against bookworm/trixie/noble/plucky as of 2026).
    # Plain 'libreoffice' (inherited from common.yaml full) is fine
    # — modern LibreOffice picks up KDE integration automatically
    # via libreoffice-style-breeze when it's installed alongside
    # Plasma.
    packages_remove:
      - libreoffice-gtk3

releases:
  bookworm:
    architectures: [arm64, amd64]
    packages:
      - accountsservice
      - libu2f-udev
    packages_remove:
      # Not in bookworm.
      - libdisplay-info-bin

  trixie:
    architectures: [arm64, amd64]
    packages:
      - accountsservice
      - libu2f-udev
      - pipewire-audio
      - pipewire-pulse
      - wireplumber
    packages_remove:
      - pulseaudio
      - pulseaudio-module-bluetooth

  noble:
    architectures: [arm64, amd64]
    packages:
      # The update notifier is a separate package on Ubuntu noble and later.
      - plasma-discover-notifier
      - polkitd
      - pkexec
      - libu2f-udev
      - pipewire-audio
      - pipewire-pulse
      - wireplumber
    packages_remove:
      - pulseaudio
      - pulseaudio-module-bluetooth

  forky:
    # Debian 14 — pipewire replaces pulseaudio (same as trixie).
    architectures: [arm64, amd64]
    packages:
      # Debian renamed network-manager-gnome.
      - network-manager-applet
      - accountsservice
      - pipewire-audio
      - pipewire-pulse
      - wireplumber
    packages_remove:
      - network-manager-gnome
      - pulseaudio
      - pulseaudio-module-bluetooth

  sid:
    # Debian unstable — pipewire replaces pulseaudio (same as trixie/forky).
    # loong64 is a 64-bit arch capable of running KDE Plasma.
    architectures: [arm64, amd64, loong64]
    packages:
      - network-manager-applet
      - accountsservice
      - pipewire-audio
      - pipewire-pulse
      - wireplumber
    packages_remove:
      - network-manager-gnome
      - pulseaudio
      - pulseaudio-module-bluetooth

  # ── Ubuntu 22.04 LTS / 25.10 / 26.04 ──────────────────────────────

  jammy:
    # Ubuntu 22.04 LTS — polkit split available via SRU;
    # pulseaudio remains default on jammy.
    architectures: [arm64, amd64]
    packages:
      - polkitd
      - pkexec
      - libu2f-udev
    packages_remove:
      # Not in jammy.
      - libdisplay-info-bin
      - wayland-utils

  resolute:
    # Ubuntu 26.04 LTS — same as questing.
    architectures: [arm64, amd64]
    packages:
      # The update notifier is a separate package on Ubuntu noble and later.
      - plasma-discover-notifier
      - polkitd
      - pkexec
      - libfido2-1
      - pipewire-audio
      - pipewire-pulse
      - wireplumber
    packages_remove:
      - pulseaudio
      - pulseaudio-module-bluetooth

tier_overrides:
  minimal:
    # Discover and its notifier show and install updates. No update-manager from common.
    architectures:
      amd64: { packages_remove: [update-manager] }
      arm64: { packages_remove: [update-manager] }

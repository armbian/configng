name: "Maintenance: Build Debian"
#
# Description
#

on:
  workflow_dispatch:
  push:
    branches:
    - main

jobs:

  Debian:
    uses: armbian/scripts/.github/workflows/pack-debian.yml@main
    with:
      matrix: "all:jammy"
      maintainer: "Igor Pecovnik <igor@armbian.com>"
      package: "armbian-config"
      licence: "GPL 2.0"
      homepage: "https://www.armbian.com"
      section: "default"
      priority: "optional"
      compile: "tools/config-assemble.sh -p"
      depends: "bash, jq, whiptail, sudo, procps, systemd, lsb-release, iproute2, debconf, libtext-iconv-perl, gpg, xz-utils, pv, python3-yaml, expect-dev, rsync, parted, dosfstools, e2fsprogs, btrfs-progs, f2fs-tools, ntfs-3g"
      description: "Armbian config: The Next Generation"

    secrets:
      PRIMARY_KEY: ${{ secrets.GPG_KEY4 }}
      TERTIARY_KEY: ${{ secrets.GPG_KEY3 }}

  Tests:
    name: "Execute unit tests"
    if: ${{ github.repository_owner == 'Armbian' }}
    needs: Debian
    runs-on: ubuntu-latest
    steps:

      - name: "Determine changed test cases"
        id: changed
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          EVENT: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.sha }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          # On a push to main, ask the API which tests/*.conf the pushed range
          # changed, so the dispatched unit-test run exercises exactly what the
          # merge touched (a desktop PR -> its one desktop). A manual build
          # (workflow_dispatch) or a first push with an all-zero before-sha can't
          # be scoped this way, so signal "all" and let the suite run in full.
          mode="all"
          changed=""
          if [[ "$EVENT" == "push" && ! "$BEFORE" =~ ^0+$ ]]; then
              mode="changed"
              changed="$(gh api "repos/${REPO}/compare/${BEFORE}...${AFTER}" \
                  --jq '[.files[].filename | select(startswith("tests/") and endswith(".conf"))] | join(" ")' \
                  2>/dev/null || true)"
          fi
          {
              echo "mode=${mode}"
              echo "changed=${changed}"
          } >> "$GITHUB_OUTPUT"
          echo "mode=${mode} changed_tests=[${changed}]"

      - name: "Run unit tests action"
        uses: peter-evans/repository-dispatch@v4
        with:
          event-type: "Unit tests"
          client-payload: '{"mode": "${{ steps.changed.outputs.mode }}", "changed_tests": "${{ steps.changed.outputs.changed }}"}'

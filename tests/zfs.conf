ENABLED=true
RELEASE="trixie:noble:resolute"
TESTARCH="arm64,amd64"
TESTNAME="ZFS install"

# The first and last remove are setup and cleanup, so their status is not a
# result. install and status are, and the trailing cleanup must not mask them:
# a plain sequence returns only the last command's status, which is how this
# reported success while the log carried "Bad return status for module build".
testcase() {(
	rc=0
	./bin/armbian-config --api module_zfs remove || true
	./bin/armbian-config --api module_zfs install || rc=$?
	if [ "$rc" -eq 0 ]; then
		./bin/armbian-config --api module_zfs status || rc=$?
	fi
	./bin/armbian-config --api module_zfs remove || true
	exit "$rc"
)}

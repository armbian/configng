ENABLED=true
RELEASE="resolute:forky"
TESTARCH="arm64,amd64"
TESTNAME="Hyprland desktop"

testcase() {(
	set -e
	# Some test containers have no regular user; the desktop needs one.
	awk -F: '$3 >= 1000 && $3 < 65534 && $7 !~ /nologin|false/ {f=1} END {exit !f}' /etc/passwd \
		|| useradd -m -s /bin/bash armbian-test
	./bin/armbian-config --api module_desktops install de=hyprland tier=minimal
	./bin/armbian-config --api module_desktops remove  de=hyprland
)}

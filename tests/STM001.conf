ENABLED=true
RELEASE=""
TESTARCH="arm64,amd64"
TESTNAME="Steam ARM64 module"

# A full install downloads well over a gigabyte and needs a desktop session,
# so this only checks the clean-system status and the arm64-only guard.
testcase() {(
	set -e
	if ./bin/armbian-config --api module_steam status; then
		echo "status reported Steam installed on a clean system" >&2
		exit 1
	fi
	if [[ "$(dpkg --print-architecture)" != "arm64" ]]; then
		if ./bin/armbian-config --api module_steam install; then
			echo "install did not refuse a non-arm64 host" >&2
			exit 1
		fi
	fi
)}

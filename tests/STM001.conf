ENABLED=true
RELEASE=""
TESTARCH="arm64,amd64"
TESTNAME="Steam module"

# A full install downloads the client or Valve's apt repository, so this only
# checks that a clean system does not report Steam as installed. Install is
# refused on architectures other than arm64 and amd64; the test matrix does
# not include those architectures.
testcase() {(
	set -e
	if ./bin/armbian-config --api module_steam status; then
		echo "status reported Steam installed on a clean system" >&2
		exit 1
	fi
	arch=$(dpkg --print-architecture)
	if [[ "$arch" != "arm64" && "$arch" != "amd64" ]]; then
		if ./bin/armbian-config --api module_steam install; then
			echo "install did not refuse an unsupported architecture" >&2
			exit 1
		fi
	fi
)}

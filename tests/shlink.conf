ENABLED=true
RELEASE="trixie:noble:resolute"
TESTARCH="arm64,amd64"
TESTNAME="Shlink install"

testcase() {(
	set -e
	./bin/armbian-config --api module_shlink purge
	SHLINK_DOMAIN="go.example.com" ./bin/armbian-config --api module_shlink install
	./bin/armbian-config --api module_shlink status
	./bin/armbian-config --api module_shlink purge
)}

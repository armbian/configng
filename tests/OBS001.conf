ENABLED=true
RELEASE=""
TESTARCH="arm64,amd64"
TESTNAME="OBS Studio for Rockchip module"

# The package is only offered on arm64 Rockchip boards, which the test matrix
# does not include, so this checks that a clean system does not report OBS as
# installed and that install is refused where the package is not supported.
testcase() {(
	set -e
	if ./bin/armbian-config --api module_obs_rockchip status; then
		echo "status reported obs-studio-rockchip installed on a clean system" >&2
		exit 1
	fi
	if ! ./bin/armbian-config --api module_obs_rockchip supported; then
		if ./bin/armbian-config --api module_obs_rockchip install; then
			echo "install did not refuse an unsupported system" >&2
			exit 1
		fi
	fi
)}

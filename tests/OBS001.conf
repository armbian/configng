ENABLED=true
RELEASE=""
TESTARCH="arm64,amd64"
TESTNAME="OBS Studio module"

# OBS Studio is offered on amd64 and arm64. The hardware build (Rockchip MPP)
# is only selected on arm64 Rockchip boards, which the test matrix does not
# include, so here we just check that a clean system reports OBS as not
# installed and that the module reports the matrix architectures as supported.
# A real install is not exercised (it would pull a desktop package).
testcase() {(
	set -e
	if ./bin/armbian-config --api module_obs status; then
		echo "status reported OBS installed on a clean system" >&2
		exit 1
	fi
	if ! ./bin/armbian-config --api module_obs supported; then
		echo "module_obs should report amd64/arm64 as supported" >&2
		exit 1
	fi
)}

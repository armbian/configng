ENABLED=true
RELEASE="trixie"
TESTARCH="arm64,amd64"
TESTNAME="Proxmox VE install"

testcase() {(
	set -e
	./bin/armbian-config --api module_proxmox remove
	./bin/armbian-config --api module_proxmox install
	./bin/armbian-config --api module_proxmox status
	./bin/armbian-config --api module_proxmox remove
	! ./bin/armbian-config --api module_proxmox status
)}

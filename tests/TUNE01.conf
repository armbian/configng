ENABLED=true
RELEASE="trixie:noble:resolute"
TESTARCH="arm64,amd64,riscv64"
TESTNAME="Tuning profiles"

testcase() {(
	set -e
	./bin/armbian-config --api module_tuning_profile list

	# Apply each profile in turn. builder and sbc are the two extremes -- one
	# uses byte-based dirty limits and a short commit interval, the other
	# ratio-based limits and a long one -- so applying one after the other also
	# covers switching between the two mutually exclusive forms.
	./bin/armbian-config --api module_tuning_profile apply builder
	./bin/armbian-config --api module_tuning_profile status
	test -f /etc/sysctl.d/99-armbian-tuning-profile.conf
	test -f /etc/systemd/system/armbian-tuning-profile.service
	grep -q '^PROFILE=builder' /etc/default/armbian-tuning-profile

	./bin/armbian-config --api module_tuning_profile apply sbc
	grep -q '^PROFILE=sbc' /etc/default/armbian-tuning-profile
	grep -q 'vm.swappiness = 100' /etc/sysctl.d/99-armbian-tuning-profile.conf

	# An unknown profile must fail rather than write a half-formed config.
	if ./bin/armbian-config --api module_tuning_profile apply nonsense; then
		echo "apply accepted an unknown profile" >&2
		exit 1
	fi
	grep -q '^PROFILE=sbc' /etc/default/armbian-tuning-profile

	./bin/armbian-config --api module_tuning_profile reset
	test ! -f /etc/sysctl.d/99-armbian-tuning-profile.conf
	test ! -f /etc/systemd/system/armbian-tuning-profile.service
)}

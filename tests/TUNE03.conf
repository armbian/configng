ENABLED=true
RELEASE="trixie:noble:resolute"
TESTARCH="arm64,amd64,riscv64"
TESTNAME="CPU frequency"

testcase() {(
	set -e
	CONF=/etc/default/cpufrequtils

	# Containers and most CI hosts have no cpufreq: status reports that and fails.
	if [ -z "$(ls -d /sys/devices/system/cpu/cpufreq/policy* 2>/dev/null)" ]; then
		if ./bin/armbian-config --api module_tuning_profile cpu status; then
			echo "unexpected success: ./bin/armbian-config --api module_tuning_profile cpu status" >&2
			exit 1
		fi
		if ./bin/armbian-config --api module_tuning_profile cpu set all governor performance; then
			echo "unexpected success: ./bin/armbian-config --api module_tuning_profile cpu set all governor performance" >&2
			exit 1
		fi
		exit 0
	fi

	./bin/armbian-config --api module_tuning_profile cpu status
	# Set the governor that runs now: the test container is privileged, so a
	# different governor would change the CI host.
	gov=$(cat /sys/devices/system/cpu/cpufreq/policy0/scaling_governor)
	./bin/armbian-config --api module_tuning_profile cpu set policy0 governor "$gov"
	grep -q "^POLICY0_GOVERNOR=${gov}$" $CONF
	test "$(cat /sys/devices/system/cpu/cpufreq/policy0/scaling_governor)" = "$gov"

	# A governor that does not exist must not reach the file.
	if ./bin/armbian-config --api module_tuning_profile cpu set policy0 governor nonsense; then
		echo "unexpected success: ./bin/armbian-config --api module_tuning_profile cpu set policy0 governor nonsense" >&2
		exit 1
	fi
	if grep -q '^POLICY0_GOVERNOR=nonsense' $CONF; then
		echo "unexpected success: grep -q '^POLICY0_GOVERNOR=nonsense' $CONF" >&2
		exit 1
	fi

	./bin/armbian-config --api module_tuning_profile cpu reset
	if grep -q '^POLICY0_' $CONF; then
		echo "unexpected success: grep -q '^POLICY0_' $CONF" >&2
		exit 1
	fi
)}
